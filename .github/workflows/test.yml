name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Unit + gateway tests
        run: npm test
      - name: Deno and Cloudflare runtimes
        run: |
          npm i --no-save wrangler@4.157.0 deno@2.9.6
          DENO_BIN=node_modules/.bin/deno WRANGLER_BIN=node_modules/.bin/wrangler node tests/platforms.mjs
      - name: Browser test (Chromium)
        run: |
          npm i --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Remote browser (real Chrome, driven through its streamed screen)
        run: |
          cd browser && npm ci
          npx playwright install --with-deps chromium
          node test.mjs
  browser-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the remote browser image and check it starts
        run: |
          docker build -f browser/Dockerfile -t tervyn-browser .
          docker run -d --name tb -p 8090:8090 -e ACCESS_KEY=ci-key tervyn-browser
          for i in $(seq 1 30); do curl -fsS localhost:8090/health && break; sleep 2; done
          curl -fsS "localhost:8090/api/servers?key=ci-key"
          docker logs tb | tail -20
