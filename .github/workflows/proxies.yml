# Finds real, working free proxies by country, every 30 minutes, for free.
# Downloads ~30 public free proxy lists, tests every server (must load an HTTPS
# page with a valid certificate; that also reveals its real country), and
# publishes the working ones as proxies.json on the `proxies` branch. Gateways
# read it from raw.githubusercontent.com (PROXY_LIST_URL in wrangler.toml).
#
# Note: GitHub runs `schedule` only from the repository's default branch, so the
# 30-minute refresh starts once this file is on main. Until then it runs on
# pushes that change it, and by hand (Actions → proxies → Run workflow).
name: proxies
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    paths: [".github/workflows/proxies.yml", "scripts/validate-proxies.mjs", "platforms/node/exits.mjs"]
concurrency:
  group: proxies
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Test free proxies
        run: node scripts/validate-proxies.mjs out/proxies.json "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/proxies/proxies.json"
      - name: Publish to the proxies branch
        run: |
          cd out
          git init -q -b proxies
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proxies.json
          git commit -qm "Free proxy list $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" proxies
          node -e 'const d=require("./proxies.json"); const by={}; for (const p of d.proxies) by[p.code]=(by[p.code]||0)+1; console.log(Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([c,n])=>c+":"+n).join(" "))' | tee -a "$GITHUB_STEP_SUMMARY"
