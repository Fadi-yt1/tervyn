# Deploys the gateway to every free platform you've added a token for, links the
# gateways together, smoke-tests them, and publishes the live list to the portal
# (GitHub Pages serves index.html + gateways.json from the branch root).
#
# Repository secrets (Settings → Secrets and variables → Actions → Secrets):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID   Cloudflare Workers (free)
#   VERCEL_TOKEN                                  Vercel Hobby (free)
#   NETLIFY_AUTH_TOKEN                            Netlify Starter (free)
# Repository variables (… → Variables), optional:
#   EXTRA_GATEWAYS      URLs of gateways deployed elsewhere (Deno Deploy, Render, VMs)
#   NETLIFY_SITE_NAME   Netlify site name (default tervyn-<owner>)
#   CONTACT             abuse contact email shown on the About page
name: deploy
on:
  workflow_dispatch:
  push:
    branches: [main, claude/beautiful-cannon-rasmat]
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      EXTRA_GATEWAYS: ${{ vars.EXTRA_GATEWAYS }}
      NETLIFY_SITE_NAME: ${{ vars.NETLIFY_SITE_NAME }}
      CONTACT: ${{ vars.CONTACT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - name: Check for tokens
        id: tokens
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN$VERCEL_TOKEN$NETLIFY_AUTH_TOKEN$EXTRA_GATEWAYS" ]; then
            echo "::notice::No deploy tokens yet. Add CLOUDFLARE_API_TOKEN / VERCEL_TOKEN / NETLIFY_AUTH_TOKEN as repository secrets (see README → Deploy)."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy, link and smoke-test
        if: steps.tokens.outputs.skip != '1'
        run: |
          if [ -n "$CONTACT" ]; then sed -i "s/^CONTACT = .*/CONTACT = \"$CONTACT\"/" wrangler.toml; fi
          bash scripts/deploy.sh
      - name: Publish the gateway list to the portal
        if: steps.tokens.outputs.skip != '1'
        run: |
          git checkout -- wrangler.toml
          if git diff --quiet -- gateways.json gateway/assets.js index.html; then echo "gateway list unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gateways.json gateway/assets.js index.html
          git commit -m "Update live gateway list [skip ci]"
          git push
