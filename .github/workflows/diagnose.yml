# Prints what each live gateway answers (status, headers, start of body). Run by hand.
name: diagnose
on:
  workflow_dispatch:
    inputs:
      url:
        description: "A site to test through every gateway (with and without a country)"
        required: false
  push:
    paths: [".github/workflows/diagnose.yml"]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test one URL through every gateway
        if: inputs.url != ''
        env:
          URL_IN: ${{ inputs.url }}
        run: |
          path="/p/$(echo "$URL_IN" | sed -E 's#^(https?)://#\1/#')"
          for gw in $(node -e 'console.log(require("./gateways.json").gateways.join(" "))'); do
            for cc in "" US CA; do
              curl -s -m 60 -D h.txt -o b.txt -H "cookie: tervyn_exit=$cc" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0 Safari/537.36" "$gw$path"
              echo "=== $gw  country='${cc:-none}' -> $(head -1 h.txt | tr -d '\r')"
              grep -iE '^(server|cf-mitigated|x-tervyn-[a-z]+|content-type|location|cf-ray):' h.txt | tr -d '\r' | sed 's/^/    /'
              echo "    body: $(sed -e 's/<script[^>]*>.*<\/script>//g; s/<[^>]*>/ /g' b.txt | tr -s ' \n\t' ' ' | head -c 300)"
            done
          done
      - name: Probe gateways
        run: |
          for gw in $(node -e 'console.log(require("./gateways.json").gateways.join(" "))'); do
            for path in /__tervyn/ping / /p/https/example.com/ /api/gateway?tervyn_path=/__tervyn/ping; do
              echo "================ $gw$path"
              curl -s -m 30 -i "$gw$path" | head -c 1500; echo
            done
          done
      - name: Countries through free proxies
        run: |
          for gw in $(node -e 'console.log(require("./gateways.json").gateways.join(" "))'); do
            echo "================ $gw/__tervyn/exits"
            curl -s -m 30 "$gw/__tervyn/exits" | head -c 600; echo
            for cc in US CA DE; do
              for site in https://example.com/ https://www.wikipedia.org/ https://api.ipify.org/?format=json; do
                out=$(curl -s -m 60 -D - -o body.txt -H "cookie: tervyn_exit=$cc" "$gw/p/${site/:\/\//\/}")
                echo "$cc $site -> $(echo "$out" | head -1 | tr -d '\r') exit=$(echo "$out" | grep -i '^x-tervyn-exit' | tr -d '\r' | cut -d' ' -f2) body: $(sed -e 's/<[^>]*>/ /g' body.txt | tr -s ' \n' ' ' | head -c 400)"
              done
            done
          done
      - name: Same tunnel code from GitHub's servers, and the Cloudflare gateway's own check
        run: |
          node scripts/check-exits.mjs "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/proxies/proxies.json" US CA DE || true
          for cc in US CA DE; do for t in http https; do echo "== cloudflare check $cc $t"; curl -s -m 90 "https://tervyn-gateway.tervyn-fadi-yt1.workers.dev/__tervyn/exits/check?cc=$cc&target=$t"; echo; done; done
      - name: Node gateway (the code Vercel's country function runs) through real free proxies
        run: |
          PROXY_LIST_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/proxies/proxies.json" PORT=8080 node platforms/node/server.mjs &
          sleep 3
          for cc in US CA DE; do
            for site in https://api.ipify.org/?format=json https://www.wikipedia.org/; do
              curl -s -m 60 -D h.txt -o b.txt -H "cookie: tervyn_exit=$cc" "http://localhost:8080/p/${site/:\/\//\/}"
              echo "node $cc $site -> $(head -1 h.txt | tr -d '\r') $(grep -i '^x-tervyn-exit' h.txt | tr -d '\r') $(head -c 100 b.txt | tr '\n' ' ')"
            done
          done
      - name: Vercel country function
        run: |
          curl -s -m 30 https://tervyn.vercel.app/__tervyn/exits | head -c 300; echo
          for cc in US CA DE; do
            curl -s -m 60 -D h.txt -o b.txt -H "cookie: tervyn_exit=$cc" "https://tervyn.vercel.app/p/https/api.ipify.org/?format=json"
            echo "vercel $cc -> $(head -1 h.txt | tr -d '\r') $(grep -i '^x-tervyn-exit' h.txt | tr -d '\r') $(sed -e 's/<[^>]*>/ /g' b.txt | tr -s ' \n' ' ' | head -c 200)"
          done
