# Prints what each live gateway answers (status, headers, start of body). Run by hand.
name: diagnose
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/diagnose.yml"]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Probe gateways
        run: |
          for gw in $(node -e 'console.log(require("./gateways.json").gateways.join(" "))'); do
            for path in /__tervyn/ping / /p/https/example.com/ /api/gateway?tervyn_path=/__tervyn/ping; do
              echo "================ $gw$path"
              curl -s -m 30 -i "$gw$path" | head -c 1500; echo
            done
          done
      - name: Countries through free proxies
        run: |
          for gw in $(node -e 'console.log(require("./gateways.json").gateways.join(" "))'); do
            echo "================ $gw/__tervyn/exits"
            curl -s -m 30 "$gw/__tervyn/exits" | head -c 600; echo
            for cc in US CA DE; do
              for site in https://example.com/ https://www.wikipedia.org/ https://api.ipify.org/?format=json; do
                out=$(curl -s -m 60 -D - -o body.txt -H "cookie: tervyn_exit=$cc" "$gw/p/${site/:\/\//\/}")
                echo "$cc $site -> $(echo "$out" | head -1 | tr -d '\r') exit=$(echo "$out" | grep -i '^x-tervyn-exit' | tr -d '\r' | cut -d' ' -f2) body: $(sed -e 's/<[^>]*>/ /g' body.txt | tr -s ' \n' ' ' | head -c 400)"
              done
            done
          done
      - name: Same tunnel code from GitHub's servers, and the Cloudflare gateway's own check
        run: |
          node scripts/check-exits.mjs "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/proxies/proxies.json" US CA DE || true
          for cc in US CA DE; do echo "== cloudflare check $cc"; curl -s -m 90 "https://tervyn-gateway.tervyn-fadi-yt1.workers.dev/__tervyn/exits/check?cc=$cc"; echo; done
